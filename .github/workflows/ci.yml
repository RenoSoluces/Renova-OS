name: Renova OS CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/multi-organisation-partage-prospects

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
      - name: Setup Python for SQL parsing
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PostgreSQL migration syntax
        run: |
          python -m pip install --disable-pip-version-check pglast
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          paths = sorted(Path("supabase/migrations").glob("*.sql"))
          for path in paths:
              parse_sql(path.read_text(encoding="utf-8"))
              print(f"SQL syntax OK: {path}")
          PY
