<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F5C5E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Renova OS" />
    <meta name="description" content="Logiciel de gestion pour la rénovation énergétique" />
    <title>RENOVA OS — Rénovation Énergétique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="startup-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;color:#18352b;background:#f6f8f7;text-align:center">
        <div style="max-width:420px">
          <div style="font-size:22px;font-weight:700;margin-bottom:12px">Renova OS</div>
          <div id="startup-message">Chargement de l’application…</div>
        </div>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        if (!document.documentElement.dataset.renovaStarted) {
          var message = document.getElementById('startup-message');
          if (message) message.innerHTML = 'Le chargement de Renova OS semble bloqué par le navigateur. Vérifiez votre connexion, puis rechargez la page. Si le problème persiste sur iPad, fermez l’onglet et rouvrez l’application depuis Safari.';
        }
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
